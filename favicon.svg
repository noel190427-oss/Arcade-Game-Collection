<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="512" height="512" rx="110" fill="#0b0f19" />
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#neonGlow)" stroke-width="12" />
  
  <!-- Arcade Cabinet Shell -->
  <path d="M120 440 L130 110 L200 60 L312 60 L382 110 L392 440 L340 450 L340 410 L172 410 L172 450 Z" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Marquee -->
  <rect x="195" y="76" width="122" height="34" rx="6" fill="#ec4899" />
  <text x="256" y="99" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" text-anchor="middle" letter-spacing="3">ARCADE</text>
  
  <!-- CRT Screen Outer & Inner -->
  <rect x="156" y="130" width="200" height="150" rx="14" fill="url(#screenBg)" stroke="#06b6d4" stroke-width="6" />
  
  <!-- CRT Pixel Game Graphics -->
  <rect x="190" y="160" width="16" height="16" fill="#06b6d4" />
  <rect x="306" y="160" width="16" height="16" fill="#06b6d4" />
  <rect x="206" y="176" width="100" height="16" fill="#06b6d4" />
  <rect x="190" y="192" width="132" height="16" fill="#ec4899" />
  <rect x="222" y="208" width="68" height="16" fill="#facc15" />
  <rect x="206" y="224" width="20" height="16" fill="#22c55e" />
  <rect x="286" y="224" width="20" height="16" fill="#22c55e" />

  <!-- Joystick & Buttons Deck -->
  <polygon points="144,300 368,300 380,360 132,360" fill="#312e81" stroke="#8b5cf6" stroke-width="5" />
  <!-- Joystick Base & Stick -->
  <ellipse cx="200" cy="336" rx="16" ry="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" />
  <line x1="200" y1="336" x2="200" y2="308" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
  <circle cx="200" cy="304" r="14" fill="#ef4444" />
  
  <!-- Action Buttons -->
  <circle cx="280" cy="334" r="9" fill="#06b6d4" />
  <circle cx="310" cy="324" r="9" fill="#ec4899" />
  <circle cx="334" cy="340" r="9" fill="#facc15" />
  
  <!-- Coin slot -->
  <rect x="236" y="385" width="40" height="10" rx="3" fill="#020617" stroke="#facc15" stroke-width="2" />
</svg>
