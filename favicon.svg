<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Neon Cyan & Purple Glow Gradient -->
    <linearGradient id="neonN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Golden Crown Gradient -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#borderGlow)" stroke-width="10" stroke-opacity="0.85" filter="url(#glowFilter)" />
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Subtle Cyber Grid Background Lines -->
  <path d="M60 180 L452 180 M60 332 L452 332 M180 60 L180 452 M332 60 L332 452" stroke="rgba(56, 189, 248, 0.06)" stroke-width="2" />

  <!-- ARCADE BASE: Left Joystick Deck -->
  <g transform="translate(110, 310)">
    <!-- Isometric Deck -->
    <polygon points="0,40 55,10 110,40 55,70" fill="#0f172a" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
    <polygon points="0,40 55,70 55,92 0,62" fill="#090d16" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
    <polygon points="55,70 110,40 110,62 55,92" fill="#05080f" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Joystick Shaft & Ball -->
    <line x1="55" y1="40" x2="55" y2="0" stroke="#facc15" stroke-width="8" stroke-linecap="round" />
    <circle cx="55" cy="-8" r="18" fill="url(#goldCrown)" filter="url(#glowFilter)" />
  </g>

  <!-- ARCADE BASE: Right Buttons Deck -->
  <g transform="translate(290, 310)">
    <!-- Isometric Deck -->
    <polygon points="0,40 55,10 110,40 55,70" fill="#0f172a" stroke="#c084fc" stroke-width="4" stroke-linejoin="round" />
    <polygon points="0,40 55,70 55,92 0,62" fill="#090d16" stroke="#c084fc" stroke-width="4" stroke-linejoin="round" />
    <polygon points="55,70 110,40 110,62 55,92" fill="#05080f" stroke="#c084fc" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Glowing Arcade Buttons -->
    <circle cx="35" cy="38" r="9" fill="#38bdf8" filter="url(#glowFilter)" />
    <circle cx="58" cy="28" r="9" fill="#f472b6" filter="url(#glowFilter)" />
    <circle cx="80" cy="38" r="9" fill="#facc15" filter="url(#glowFilter)" />
  </g>

  <!-- THE ICONIC 3D CYBER "N" -->
  <!-- Back Shadow / Glow Layer -->
  <path d="M168 360 L168 180 L236 180 L308 290 L308 180 L364 180 L364 360 L296 360 L224 250 L224 360 Z"
        fill="none" stroke="rgba(192, 132, 252, 0.4)" stroke-width="38" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowFilter)" />

  <!-- Main 3D Neon "N" Body -->
  <path d="M168 360 L168 180 L236 180 L308 290 L308 180 L364 180 L364 360 L296 360 L224 250 L224 360 Z"
        fill="#0b0f19" stroke="url(#neonN)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Inner High-Tech Circuit Stripe -->
  <path d="M182 344 L182 196 L226 196 L318 336 L350 336 L350 196"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9" filter="url(#glowFilter)" />

  <!-- ROYAL CYBER CROWN ON TOP -->
  <g transform="translate(230, 80)" filter="url(#glowFilter)">
    <!-- Crown Body -->
    <path d="M26 80 L0 25 L36 45 L65 0 L94 45 L130 25 L104 80 Z"
          fill="url(#goldCrown)" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Crown Jewels / Glowing Dots -->
    <circle cx="0" cy="22" r="5" fill="#38bdf8" />
    <circle cx="65" cy="-2" r="7" fill="#ffffff" />
    <circle cx="130" cy="22" r="5" fill="#38bdf8" />
    
    <!-- Crown Rim & Details -->
    <rect x="22" y="72" width="86" height="10" rx="4" fill="#0f172a" stroke="#facc15" stroke-width="3" />
    <circle cx="45" cy="77" r="3" fill="#ec4899" />
    <circle cx="65" cy="77" r="3" fill="#38bdf8" />
    <circle cx="85" cy="77" r="3" fill="#ec4899" />
  </g>
</svg>
